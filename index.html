<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('report-studio:theme')
          var language = localStorage.getItem('report-studio:language')
          var root = document.documentElement
          root.classList.remove('light', 'dark')
          root.classList.add(theme === 'light' ? 'light' : 'dark')
          root.lang = language === 'ar' ? 'ar' : 'en'
          root.dir = language === 'ar' ? 'rtl' : 'ltr'
        } catch (e) {}
      })()
    </script>
    <style>
      html {
        background-color: #0f172a;
      }
      html.light {
        background-color: #f8fafc;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background-color: inherit;
        color: #f8fafc;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      html.light body {
        color: #0f172a;
      }
      #root {
        min-height: 100dvh;
      }
      .rs-boot {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
      }
      .rs-boot-spinner {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 9999px;
        border: 2px solid #475569;
        border-top-color: #f8fafc;
        animation: rs-boot-spin 0.7s linear infinite;
      }
      html.light .rs-boot-spinner {
        border-color: #cbd5e1;
        border-top-color: #334155;
      }
      .rs-boot-title {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .rs-boot-muted {
        margin: 0;
        font-size: 0.75rem;
        opacity: 0.65;
      }
      @keyframes rs-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Report Studio</title>
  </head>
  <body>
    <div id="root">
      <div class="rs-boot" role="status" aria-live="polite" aria-label="Loading Report Studio">
        <div class="rs-boot-spinner" aria-hidden="true"></div>
        <p class="rs-boot-title">Report Studio</p>
        <p class="rs-boot-muted">Loading…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
